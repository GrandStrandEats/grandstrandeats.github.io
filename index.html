<style>
:root{
  --bg:#f6f3ee; --surface:#ffffff; --ink:#14212b; --muted:#5d6b75; --line:#e6e0d6;
  --brand:#0e7c86; --brand-ink:#ffffff; --sun:#ff8a3d; --open:#1f9d55; --closed:#d64545; --unk:#8a96a0;
  --chip:#eef2f2; --shadow:0 6px 24px rgba(20,33,43,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f161b; --surface:#172229; --ink:#ecf2f4; --muted:#9aa9b2; --line:#24333c;
    --brand:#2cc0c9; --brand-ink:#06252a; --chip:#1f2d35; --shadow:0 6px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0f161b; --surface:#172229; --ink:#ecf2f4; --muted:#9aa9b2; --line:#24333c;
  --brand:#2cc0c9; --brand-ink:#06252a; --chip:#1f2d35; --shadow:0 6px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);height:100dvh}
header{padding:14px 16px 10px;background:var(--surface);border-bottom:1px solid var(--line);z-index:5}
.top{display:flex;align-items:center;gap:10px}
.logo{width:clamp(46px,13vw,56px);height:clamp(46px,13vw,56px);flex:0 0 auto;border-radius:50%;object-fit:cover;display:block;box-shadow:var(--shadow)}
.brand{font-weight:800;font-size:clamp(21px,6vw,28px);line-height:1.1;letter-spacing:-.03em;flex:1;min-width:0}
.brand small{display:block;font-weight:600;font-size:12.5px;line-height:1.3;margin-top:2px;color:var(--muted);letter-spacing:0}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center}
.iconbtn.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.ask{margin:12px 0 8px;font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.ask span{color:var(--brand)}
.vibes{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px}
.vibes::-webkit-scrollbar{display:none}
.vibe{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:9px 13px;font-weight:700;font-size:14px;white-space:nowrap;transition:.15s}
.vibe.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.row2{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 11px;font-weight:800;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
select,input[type=search]{font:inherit;font-size:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:7px 10px}
input[type=search]{flex:1;min-width:140px}
main{display:grid;grid-template-columns:420px 1fr;min-height:0}
#list{overflow-y:auto;padding:12px 16px 90px;min-height:0}
#map{min-height:0;z-index:1}
.count{font-size:13px;color:var(--muted);font-weight:600;margin:4px 2px 10px;display:flex;justify-content:space-between;align-items:center}
.note{font-size:12px;color:var(--muted);background:var(--chip);border-radius:12px;padding:8px 10px;margin-bottom:12px}
.card{display:grid;grid-template-columns:76px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;margin-bottom:10px;box-shadow:var(--shadow);transition:.15s}
.card.hl{outline:2.5px solid var(--brand)}
.card.feat{border:2px solid var(--sun)}
.tag.feat{background:var(--sun);color:#fff}
.thumb{border-radius:14px;display:grid;place-items:center;font-size:34px;aspect-ratio:1}
.name{font-weight:800;font-size:16px;letter-spacing:-.02em;display:flex;justify-content:space-between;gap:6px}
.heart{border:0;background:none;font-size:18px;padding:0 2px;line-height:1}
.meta{font-size:13px;color:var(--muted);margin:2px 0 6px}
.status{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800}
.dot{width:8px;height:8px;border-radius:50%}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.tag{font-size:11.5px;font-weight:700;background:var(--chip);border-radius:8px;padding:3px 7px}
.acts{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.acts a.fix{color:var(--muted);margin-left:auto}
.chk{font-size:11.5px;font-weight:700;color:var(--muted);margin-left:8px;white-space:nowrap}
.acts a{font-size:12.5px;font-weight:800;text-decoration:none;color:var(--brand);border:1.5px solid var(--line);border-radius:10px;padding:5px 9px}
.todo{background:var(--surface);border:1.5px dashed var(--brand);border-radius:18px;padding:12px;margin-bottom:10px}
.todo-h{font-weight:800;font-size:15px;letter-spacing:-.02em;margin-bottom:8px}
.todo-links{display:flex;flex-wrap:wrap;gap:6px}
.todo-links a{font-size:12.5px;font-weight:800;text-decoration:none;color:var(--brand);border:1.5px solid var(--line);border-radius:10px;padding:5px 9px}
.todo-f{font-size:11px;color:var(--muted);margin-top:8px}
.modes{display:flex;margin-top:12px;max-width:520px;padding:4px;gap:4px;border:0;border-radius:16px;background:var(--chip)}.modes button{flex:1;padding:11px 8px;font-size:15.5px;border-radius:12px;color:var(--ink);white-space:nowrap}.modes button.on{box-shadow:var(--shadow)}
.desc{font-size:13px;line-height:1.4;margin:0 0 6px}
.guides{margin-top:8px;font-weight:600}.guides a{color:var(--brand);font-weight:800}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.foot{font-size:11.5px;color:var(--muted);line-height:1.5;padding:14px 4px 0;border-top:1px solid var(--line);margin-top:6px}
.fab{position:fixed;right:16px;bottom:16px;z-index:10;border:0;border-radius:999px;padding:14px 18px;font-weight:800;background:linear-gradient(135deg,var(--sun),#ff5e7e);color:#fff;box-shadow:0 10px 30px rgba(255,94,126,.45)}
.pin{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--surface);border:2.5px solid var(--brand);display:grid;place-items:center;box-shadow:var(--shadow)}
.pin span{transform:rotate(45deg);font-size:16px}
.pin.closed{border-color:var(--unk);opacity:.75}
.me{width:16px;height:16px;border-radius:50%;background:#2f80ff;border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,128,255,.25)}
.viewtoggle{display:none}
.install{display:none}
.iosnote{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px 44px 16px 16px;font-size:15px;line-height:1.5;max-width:420px;margin:0 auto}
.iosnote[hidden]{display:none}
.iosnote b{font-weight:800}
.iosnote ol{margin:6px 0 0;padding-left:20px}
.iosnote .x{position:absolute;top:8px;right:8px;border:0;background:var(--chip);color:var(--ink);border-radius:999px;width:30px;height:30px;font-size:16px}
.leaflet-popup-content{font-family:inherit;font-weight:700}
@media (max-width:820px){
  main{grid-template-columns:1fr}
  #map{display:none}
  main.showmap #map{display:block;height:70dvh}
  main.showmap #list{display:none}
  /* Phone list view: the whole page scrolls, so the filters slide away and the list gets the full screen. */
  html,body{height:auto}
  .app{display:block;height:auto}
  #list{overflow:visible}
  /* Phone map view: back to one fixed screen so the map fills what is left. */
  .app:has(main.showmap){display:grid;height:100dvh}
  .app:has(main.showmap) #map{height:auto}
  .viewtoggle{display:flex}
  .ask{font-size:20px}
}
</style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1963548887313701" crossorigin="anonymous"></script>
</head>
<body>
<div class="iosnote" id="iosnote" role="dialog" aria-label="Add to Home Screen" hidden><button class="x" id="iosclose" aria-label="Close">✕</button><b>📱 Put Grand Strand Eats on your iPhone</b><ol><li>Tap the <b>Share</b> button <span aria-hidden="true">(the square with an arrow ⬆)</span> in Safari.</li><li>Scroll down and tap <b>Add to Home Screen</b>.</li></ol>It opens like an app, full screen, and works offline.</div>
<div class="app">
<header>
  <div class="top">
    <img class="logo" src="logo.jpg" alt="Grand Strand Eats logo" width="56" height="56">
    <div class="brand">Grand Strand Eats<small>Myrtle Beach &amp; the Grand Strand</small></div>
    <button class="iconbtn install" id="install">⬇ Get the app</button>
    <button class="iconbtn install" id="iosinstall">📱 Get the app</button>
    <button class="iconbtn viewtoggle" id="viewtoggle">🗺 Map</button>
  </div>
  <div class="seg modes" id="mode" role="tablist"><button data-m="eat" class="on">🍽 Places to eat</button><button data-m="do">🎡 Things to do</button></div>
  <div class="ask" id="ask">What's the <span>vibe</span> tonight?</div>
  <div class="vibes" id="vibes"></div>
  <div class="row2">
    <div class="seg" id="price"></div>
    <select id="when" aria-label="When">
      <option value="any">Any time</option>
      <option value="now">Open now</option>
      <option value="breakfast">Breakfast (8 AM)</option>
      <option value="lunch">Lunch (12 PM)</option>
      <option value="dinner">Dinner (7 PM)</option>
      <option value="late">Late (10 PM)</option>
    </select>
    <select id="day" aria-label="Day"></select>
    <button class="iconbtn" id="near">📍 Near me</button>
    <input type="search" id="q" placeholder="🔎 Search a restaurant or food…" aria-label="Search">
  </div>
</header>
<main id="main">
  <div id="list"></div>
  <div id="map"></div>
</main>
</div>
<button class="fab" id="surprise">🎲 Surprise me</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<script src="data.js"></script>
<script src="todo.js"></script>
<script src="app.js"></script>
</body>
</html>
